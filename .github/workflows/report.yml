name: Build And Release Report

on:
  push:
    paths:
      - .github/workflows/report.yml
      - report/main.tex
      - report/Makefile
      - report/README.md
      - report/references.bib
      - report/sections/**
  pull_request:
    paths:
      - .github/workflows/report.yml
      - report/main.tex
      - report/Makefile
      - report/README.md
      - report/references.bib
      - report/sections/**
  workflow_dispatch:

jobs:
  build-report:
    name: Build report PDF
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report
          args: -pdf -interaction=nonstopmode -halt-on-error -outdir=build

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: report/build/main.pdf
          if-no-files-found: error

  release-report:
    name: Release report PDF
    needs: build-report
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: report-pdf
          path: dist

      - name: Rename release asset
        run: mv dist/main.pdf dist/aions-edge-report.pdf

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: report-${{ github.run_number }}
          name: Report build #${{ github.run_number }}
          files: dist/aions-edge-report.pdf
          generate_release_notes: true
